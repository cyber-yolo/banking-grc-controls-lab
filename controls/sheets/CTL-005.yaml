id: CTL-005
name: Periodic review of privileged access
domain: Privileged access
type: detective
automation: semi-automated
frequency: quarterly
status: written
owner_role: Role owners (first line)
reviewer_role: ICT risk management (second line)
objective: >
  Eligible and active assignments to privileged roles are reviewed at least
  every quarter by a reviewer other than the holder, and unapproved access is
  removed.
risks: [RSK-02]
requirements: [REQ-RMF-02, REQ-DORA-04, REQ-CH-01, REQ-EBA-03]
implementation:
  platform: Microsoft Entra ID Governance access reviews
  configuration: Recurring access review on privileged directory roles, quarterly, auto-apply results, removal if no response.
  terraform: null
evidence:
  - {id: EV-009, item: AccessReviewDefinitions, description: Access review definitions with scope and recurrence}
assertions:
  - {id: CTL-005-A1, test: design, text: An access review definition scopes privileged directory role assignments}
  - {id: CTL-005-A2, test: design, text: Its recurrence is at most three months}
tests:
  design:
    id: TC-309
    steps:
      - Create the review. Run the collector for EV-009 and the evaluator.
    expected: CTL-005-A1 and CTL-005-A2 PASS
  effectiveness:
    id: TC-310
    steps:
      - Start one review instance on demand, deny user2's eligible assignment, let results apply.
    expected: user2 eligibility removed; decision history exported as evidence
detections: []
limits:
  - A 30-day lab cannot show two quarterly cycles; effectiveness is shown on one on-demand instance only.
