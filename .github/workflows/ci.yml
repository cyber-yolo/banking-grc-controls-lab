name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -c .yamllint.yml .
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Requirements, controls, detections, scenarios and leak checks
        run: python tools/validate_repo.py
      - name: Evaluator unit tests (synthetic fixtures)
        run: python -m pytest -q
      - name: Traceability matrix is up to date
        run: python tools/build_report.py --check
      - name: Repository-only controls (CTL-007-A2, CTL-014)
        run: python tools/evaluate_controls.py --controls CTL-014 --fail-on fail

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init without backend or credentials
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks detect --source . --redact --no-banner -v
